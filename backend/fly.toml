# Fly.io app config. App name and region are placeholders; flyctl will
# set `app` on first launch / `fly apps create`.
#
# Why these knobs:
# - Postgres lives off-platform (Neon, etc.). DATABASE_URL (pooled) and
#   DATABASE_URL_DIRECT (unpooled, for migrations) are set via `fly secrets set`.
# - min_machines_running = 1 keeps the Drive `files.watch` webhook
#   reachable without cold-start drops (SPEC §8.3). Auto-stop still
#   trims any auto-scaled extras when idle.
# - Health check hits /healthz (served by `deno task serve`).
# - Secrets (GOOGLE_*, MARGIN_MASTER_KEY, BETTER_AUTH_SECRET,
#   DATABASE_URL, DATABASE_URL_DIRECT) are set via `fly secrets set`.
#
# Build context note: the Dockerfile needs both backend/ and shared/, so
# the Docker build context is the repo root. Invoke as
# `flyctl deploy --config backend/fly.toml` from the repo root —
# flyctl's workdir defaults to cwd (which becomes the build context),
# and --config points at this file. The `dockerfile = "Dockerfile"`
# entry below is resolved relative to this fly.toml, so it picks up
# backend/Dockerfile.

app = "margin-server"
primary_region = "lhr"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "8787"
  NODE_ENV = "production"
  # Public origin used to compute the Drive files.watch callback URL and to
  # gate the in-process renew + polling loops. Update if the app is renamed.
  MARGIN_PUBLIC_BASE_URL = "https://api.margin.pub"
  # Fly's edge sets `Fly-Client-IP` / `X-Forwarded-For` for every request;
  # opt in so the rate limiter buckets per real client instead of per edge IP.
  MARGIN_TRUST_PROXY = "1"
  # Opt out of Better Auth's telemetry. The runtime env doesn't otherwise
  # set this; explicit "0" makes the intent durable.
  BETTER_AUTH_TELEMETRY = "0"

[http_service]
  internal_port = 8787
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

  [[http_service.checks]]
    grace_period = "10s"
    interval = "30s"
    method = "GET"
    timeout = "5s"
    path = "/healthz"

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 512
