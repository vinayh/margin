name: site

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "shared/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read

# One in-flight deploy at a time; queue the rest, don't cancel the running one.
concurrency:
  group: pages
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
      - uses: denoland/setup-deno@f2274c2c340e0c81c8f7dc407b2a477b8935f171 # v2
        with:
          deno-version: v2.x
      # Deno is the package manager (writes deno.lock + node_modules/);
      # astro runs under Node via its #!/usr/bin/env node shebang.
      - run: deno ci
      - run: deno lint
      - run: deno fmt --check
      - run: deno task check
      - run: deno task build
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: site/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5
