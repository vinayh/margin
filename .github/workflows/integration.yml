name: app-integration

# Live-Google integration tests. Runs separately from CI:
#   - workflow_dispatch: manual trigger from the Actions tab
#   - schedule: nightly at 07:00 UTC
# Not gated on every push — Google quotas are per-project, and a Google-side
# outage shouldn't block unrelated PRs. Codecov merges the report uploaded
# here (flag: integration) with the unit report from ci.yml (flag: unit) into
# the project total.

on:
  workflow_dispatch:
  schedule:
    - cron: "0 7 * * *"

# Least-privilege GITHUB_TOKEN. Codecov uses its own CODECOV_TOKEN.
permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  integration-with-live-google:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: denoland/setup-deno@f2274c2c340e0c81c8f7dc407b2a477b8935f171 # v2
        with:
          deno-version: v2.x
      - run: deno ci
      - run: deno task typecheck

      - name: Run integration tests with coverage
        # Deno test picks up every *.integration.test.ts file under test/
        # — new integration files don't need to be listed here individually.
        run: deno test --allow-env --allow-read --allow-write --allow-net --allow-sys --allow-run --no-check --coverage=coverage 'test/*.integration.test.ts' && deno coverage --lcov --output=coverage/lcov.info coverage
        env:
          GOOGLE_CI_REFRESH_TOKEN: ${{ secrets.GOOGLE_CI_REFRESH_TOKEN }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          MARGIN_MASTER_KEY: ${{ secrets.MARGIN_MASTER_KEY }}

      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v6
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: backend/coverage/lcov.info
          flags: integration
          fail_ci_if_error: false
